# Local development database (plan §19.3). Same major/minor as production: MySQL 8.0.
services:
  mysql:
    image: mysql:8.0
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hudumalink
      MYSQL_USER: huduma
      MYSQL_PASSWORD: huduma
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/mysql-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  mysql-data:
