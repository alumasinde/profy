openapi: 3.1.0
info:
  title: HudumaLink API
  version: 0.4.0
  description: |
    REST API shared by the Svelte web app and the future Kotlin app (plan §15).
    Phases 1–3: platform, authentication, roles, audit, settings, pages, navigation, catalogue, locations, redirects.

    * Cookie-authenticated unsafe requests must send `X-CSRF-Token` equal to the
      `hl_csrf` (or `__Host-hl_csrf`) cookie.
    * Identifiers are public UUIDs or slugs, never internal IDs.
    * Errors use stable codes; `message` is an English fallback, clients localize by `code`.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: hl_session
  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    UserID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    LocationRef:
      type: object
      properties:
        type: { type: string, enum: [county, town, area] }
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        label: { type: string, description: "e.g. Parklands, Westlands, Nairobi" }
        status: { type: string }
        selectable: { type: boolean }
    Media:
      type: object
      properties:
        id: { type: string, format: uuid }
        purpose: { type: string, enum: [profile, cover, portfolio, verification_document] }
        status: { type: string, enum: [active, pending_moderation, rejected, deleted] }
        content_type: { type: string }
        bytes: { type: integer }
        width: { type: integer }
        height: { type: integer }
        url: { type: string, description: Largest public JPEG variant }
        urls: { type: object, additionalProperties: { type: string }, description: "width → URL (160/480/960/1600, never upscaled)" }
        moderation_note: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    OfferInput:
      type: object
      properties:
        service_id: { type: string, format: uuid, description: Create only; the service must be published }
        custom_title: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        pricing_type: { type: string, enum: [fixed, from, range, on_quote] }
        price_from: { type: integer, nullable: true, description: Whole KES; required unless on_quote }
        price_to: { type: integer, nullable: true, description: Whole KES; range only, ≥ price_from }
        status: { type: string, enum: [active, hidden] }
    Listing:
      type: object
      description: A provider listing as seen by its owner or staff (staff views add owner, claim and history).
      properties:
        id: { type: string, format: uuid }
        provider_type: { type: string, enum: [individual, business] }
        display_name: { type: string }
        slug: { type: string }
        path: { type: string, example: /professionals/jane-wanjiru-plumbing }
        description: { type: string }
        years_experience: { type: integer, nullable: true }
        status: { type: string, enum: [draft, pending_review, published, paused, suspended, archived] }
        status_reason: { type: string, nullable: true }
        base_area: { allOf: [{ $ref: "#/components/schemas/LocationRef" }], nullable: true }
        service_radius_km: { type: integer, nullable: true }
        pin: { type: object, nullable: true, description: Private; never shown publicly, properties: { latitude: { type: number }, longitude: { type: number }, accuracy_m: { type: integer, nullable: true }, source: { type: string } } }
        profile_photo: { allOf: [{ $ref: "#/components/schemas/Media" }], nullable: true }
        cover_photo: { allOf: [{ $ref: "#/components/schemas/Media" }], nullable: true }
        services: { type: array, items: { type: object } }
        coverage: { type: array, items: { $ref: "#/components/schemas/LocationRef" } }
        contacts: { type: array, items: { type: object, properties: { channel: { type: string, enum: [phone, whatsapp, email] }, value: { type: string }, visibility: { type: string, enum: [public, reveal_on_click, logged_in_only, hidden] }, verified_at: { type: string, format: date-time, nullable: true } } } }
        portfolio: { type: array, items: { type: object, properties: { id: { type: string }, caption: { type: string, nullable: true }, position: { type: integer }, media: { $ref: "#/components/schemas/Media" } } } }
        badges: { type: array, items: { type: object, properties: { type: { type: string }, label: { type: string }, description: { type: string }, service_name: { type: string }, verified_at: { type: string, nullable: true }, expires_at: { type: string, nullable: true } } } }
        completeness: { type: object, properties: { score: { type: integer }, can_submit: { type: boolean }, items: { type: array, items: { type: object, properties: { key: { type: string }, done: { type: boolean }, required: { type: boolean }, weight: { type: integer } } } } } }
        terms_accepted: { type: boolean }
        current_terms_version: { type: string }
        assisted: { type: boolean }
        submitted_at: { type: string, format: date-time, nullable: true }
        published_at: { type: string, format: date-time, nullable: true }
    ListingResponse:
      type: object
      properties: { data: { $ref: "#/components/schemas/Listing" } }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              enum: [bad_request, validation_failed, unauthenticated, forbidden, not_found, conflict, rate_limited,
                internal_error, csrf_failed, invalid_or_expired_code, invalid_credentials, reauthentication_required,
                weak_pin, channel_unavailable, pin_locked, unsupported_media_type, parent_not_published, has_dependents,
                location_merged, no_provider, listing_incomplete, invalid_transition, listing_archived,
                claim_destination_mismatch, provider_exists, claim_invalid, already_claimed]
            message: { type: string }
            fields:
              type: object
              additionalProperties: { type: string }
              description: Per-field codes such as required, invalid, too_long, pin_sequence.
            request_id: { type: string }
    PageMeta:
      type: object
      properties:
        next_cursor: { type: [string, "null"] }
    Challenge:
      type: object
      required: [challenge_id, channel, destination_masked, expires_in, resend_after]
      properties:
        challenge_id: { type: string, format: uuid }
        channel: { type: string, enum: [sms, email] }
        destination_masked: { type: string }
        expires_in: { type: integer, description: seconds }
        resend_after: { type: integer, description: seconds }
    User:
      type: object
      required: [public_id, first_name, middle_name, last_name, display_name, email, phone, email_verified,
        phone_verified, preferred_locale, roles]
      properties:
        public_id: { type: string, format: uuid }
        first_name: { type: string }
        middle_name: { type: [string, "null"] }
        last_name: { type: string }
        display_name: { type: string }
        email: { type: [string, "null"] }
        phone: { type: [string, "null"], description: E.164 }
        email_verified: { type: boolean }
        phone_verified: { type: boolean }
        preferred_locale: { type: string }
        roles: { type: array, items: { type: string } }
    AdminUser:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            status: { type: string, enum: [active, suspended, pending_deletion, deleted] }
            last_login_at: { type: [string, "null"], format: date-time }
            created_at: { type: string, format: date-time }
    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        auth_method: { type: string, enum: [otp, pin, recovery] }
        device_name: { type: string }
        user_agent: { type: string }
        ip_address: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        is_current: { type: boolean }
    Role:
      type: object
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        is_system: { type: boolean }
        is_protected: { type: boolean }
        user_count: { type: integer }
        permissions: { type: array, items: { type: string } }
    Permission:
      type: object
      properties:
        key: { type: string }
        module: { type: string }
        description: { type: string }
    AuditEntry:
      type: object
      properties:
        id: { type: string }
        actor_public_id: { type: [string, "null"] }
        actor_name: { type: [string, "null"] }
        action: { type: string }
        entity_type: { type: string }
        entity_id: { type: [string, "null"] }
        old_values: { type: object }
        new_values: { type: object }
        ip_address: { type: string, description: Only with audit_logs.view_sensitive }
        request_id: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    Lifecycle:
      type: string
      enum: [draft, published, archived]
      description: Publishing/unpublishing/restoring needs <resource>.publish; archiving needs <resource>.archive.
    Seo:
      type: object
      properties:
        meta_title: { type: [string, "null"], maxLength: 160 }
        meta_description: { type: [string, "null"], maxLength: 320 }
    Setting:
      type: object
      properties:
        key: { type: string }
        kind: { type: string, enum: [string, url, asset, email, phone, color, locale, timezone, country, currency, version, social, channels] }
        group: { type: string }
        required: { type: boolean }
        max_length: { type: integer }
        public: { type: boolean }
        value: {}
    Flag:
      type: object
      properties:
        key: { type: string }
        enabled: { type: boolean }
        description: { type: string }
    Page:
      allOf:
        - $ref: "#/components/schemas/Seo"
        - type: object
          properties:
            id: { type: string, format: uuid }
            slug: { type: string }
            path: { type: string }
            title: { type: string }
            body: { type: string, description: Restricted Markdown (headings, lists, bold, safe links) }
            status: { $ref: "#/components/schemas/Lifecycle" }
            robots_index: { type: boolean }
            published_at: { type: [string, "null"], format: date-time }
            updated_at: { type: string, format: date-time }
    MenuItem:
      type: object
      required: [label, url, is_active]
      properties:
        id: { type: string, format: uuid }
        label: { type: string, maxLength: 80 }
        url: { type: string, description: "Site path (/about), https://, mailto: or tel:" }
        is_active: { type: boolean }
    Category:
      allOf:
        - $ref: "#/components/schemas/Seo"
        - type: object
          properties:
            id: { type: string, format: uuid }
            parent_id: { type: [string, "null"], format: uuid }
            slug: { type: string }
            path: { type: string }
            name: { type: string }
            description: { type: string }
            sort_order: { type: integer }
            status: { $ref: "#/components/schemas/Lifecycle" }
            published_at: { type: [string, "null"], format: date-time }
            service_count: { type: integer }
    Service:
      allOf:
        - $ref: "#/components/schemas/Seo"
        - type: object
          properties:
            id: { type: string, format: uuid }
            category_id: { type: string, format: uuid }
            category_name: { type: string }
            slug: { type: string }
            path: { type: string }
            name: { type: string }
            description: { type: string }
            requires_licence: { type: boolean }
            sort_order: { type: integer }
            status: { $ref: "#/components/schemas/Lifecycle" }
            published_at: { type: [string, "null"], format: date-time }
            synonyms: { type: [array, "null"], items: { type: string } }
    Location:
      allOf:
        - $ref: "#/components/schemas/Seo"
        - type: object
          properties:
            id: { type: string, format: uuid }
            type: { type: string, enum: [county, town, area] }
            name: { type: string }
            slug: { type: string, description: Unique across counties, towns and areas }
            path: { type: string }
            code: { type: string, description: County code (counties only) }
            parent_id: { type: [string, "null"], format: uuid }
            parent_name: { type: string }
            is_selectable: { type: boolean }
            is_indexable: { type: boolean }
            status: { type: string, enum: [active, archived] }
            merged_into_id: { type: string, format: uuid }
            child_count: { type: integer }
            centroid:
              type: [object, "null"]
              properties:
                latitude: { type: number }
                longitude: { type: number }
            aliases: { type: array, items: { type: string } }
    Redirect:
      type: object
      properties:
        id: { type: string }
        old_path: { type: string }
        new_path: { type: string }
        source: { type: string, enum: [auto, manual] }
        created_at: { type: string, format: date-time }
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ChallengeSent:
      description: |
        A code was sent if the details are valid. The response is identical whether or not an
        account exists for the destination.
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/Challenge" }
    SignedIn:
      description: Session cookie set; CSRF cookie rotated.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  authenticated: { type: boolean }
                  new_user: { type: boolean }
paths:
  /i18n/{locale}:
    get:
      security: []
      summary: UI string catalogue (shared with server-rendered pages)
      parameters:
        - { name: locale, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Messages merged over the default locale
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      locale: { type: string }
                      locales: { type: array, items: { type: string } }
                      messages: { type: object, additionalProperties: { type: string } }
        "404": { $ref: "#/components/responses/Error" }
  /settings/public:
    get:
      security: []
      summary: Public site settings and feature flags
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      settings: { type: object }
                      feature_flags: { type: object, additionalProperties: { type: boolean } }
  /auth/session:
    get:
      security: []
      summary: Current session (also issues the CSRF cookie)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      authenticated: { type: boolean }
                      user: { $ref: "#/components/schemas/User" }
                      permissions: { type: array, items: { type: string }, description: Display only }
                      has_pin: { type: boolean }
                      reauthenticated_until: { type: [string, "null"], format: date-time }
  /auth/register:
    post:
      security: []
      summary: Start registration (sends an OTP)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, destination, accept_terms]
              additionalProperties: false
              properties:
                first_name: { type: string, maxLength: 100 }
                middle_name: { type: [string, "null"], maxLength: 100 }
                last_name: { type: string, maxLength: 100 }
                destination: { type: string, description: "Kenyan mobile (07…, 01…, 254…, +254…) or email" }
                accept_terms: { type: boolean }
                locale: { type: string }
      responses:
        "202": { $ref: "#/components/responses/ChallengeSent" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/otp/send:
    post:
      security: []
      summary: Send a login code, or a sensitive_change code to the signed-in user's verified channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                destination: { type: string }
                purpose: { type: string, enum: [login, sensitive_change], default: login }
                channel: { type: string, enum: [sms, email] }
      responses:
        "202": { $ref: "#/components/responses/ChallengeSent" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/otp/verify:
    post:
      security: []
      summary: Verify a registration, login or sensitive_change code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, code]
              additionalProperties: false
              properties:
                challenge_id: { type: string, format: uuid }
                code: { type: string, pattern: "^[0-9]{6}$" }
                device_name: { type: string, maxLength: 120 }
      responses:
        "200": { $ref: "#/components/responses/SignedIn" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/pin/setup:
    post:
      summary: Set or replace the PIN (requires re-verification within 10 minutes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "204": { description: Saved }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /auth/pin/login:
    post:
      security: []
      summary: PIN login on a device that previously completed OTP login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destination, pin]
              properties:
                destination: { type: string }
                pin: { type: string }
      responses:
        "200": { $ref: "#/components/responses/SignedIn" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      summary: Revoke the current session
      responses:
        "204": { description: Signed out }
  /auth/recovery/start:
    post:
      security: []
      summary: Send a recovery code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destination]
              properties:
                destination: { type: string }
      responses:
        "202": { $ref: "#/components/responses/ChallengeSent" }
  /auth/recovery/complete:
    post:
      security: []
      summary: Verify recovery, unlock or replace the PIN, sign out all other sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, code]
              properties:
                challenge_id: { type: string, format: uuid }
                code: { type: string }
                new_pin: { type: [string, "null"] }
                device_name: { type: string }
      responses:
        "200": { $ref: "#/components/responses/SignedIn" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /auth/sessions:
    get:
      summary: Signed-in devices
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Session" } }
    delete:
      summary: Sign out all other devices
      responses:
        "200":
          description: Count revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, properties: { revoked: { type: integer } } }
  /auth/sessions/{id}:
    delete:
      summary: Sign out one of your own sessions
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Error" }
  /customer/profile:
    get:
      summary: Own profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/User" }
    patch:
      summary: Update own names and language
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name]
              additionalProperties: false
              properties:
                first_name: { type: string }
                middle_name: { type: [string, "null"] }
                last_name: { type: string }
                preferred_locale: { type: string }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/roles:
    get:
      summary: Roles with permissions (roles.view)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Role" } }
  /admin/roles/{key}/permissions:
    put:
      summary: Replace a role's permissions (roles.permissions.assign; audited)
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions: { type: array, items: { type: string } }
      responses:
        "200":
          description: Updated role
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Role" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/permissions:
    get:
      summary: Permission catalogue (permissions.view)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Permission" } }
  /admin/users:
    get:
      summary: Users, newest first (users.view_any)
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AdminUser" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
  /admin/users/{id}:
    get:
      summary: One user (users.view_any)
      parameters: [{ $ref: "#/components/parameters/UserID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AdminUser" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/users/{id}/roles:
    put:
      summary: Replace a user's roles (users.roles.assign; protected roles need a holder; audited)
      parameters: [{ $ref: "#/components/parameters/UserID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles: { type: array, items: { type: string } }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AdminUser" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/users/{id}/status:
    patch:
      summary: Suspend (users.suspend, reason required) or restore (users.restore); audited
      parameters: [{ $ref: "#/components/parameters/UserID" }]
      requestBody:
        required: true
        content:
