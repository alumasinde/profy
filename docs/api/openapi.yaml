        "429": { $ref: "#/components/responses/Error" }
  /provider/contacts/verify/confirm:
    post:
      summary: Confirm the code; marks the contact verified and grants phone_verified / email_verified
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { challenge_id: { type: string }, code: { type: string } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ListingResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /provider/media:
    post:
      summary: "Upload (multipart: purpose=profile|cover|portfolio, caption, file). Type is sniffed; images are re-encoded to JPEG variants with metadata stripped"
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, properties: { purpose: { type: string }, caption: { type: string }, file: { type: string, format: binary } } } } } }
      responses:
        "201": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ListingResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /provider/media/{media}:
    delete:
      summary: Delete one of the listing's photos
      parameters: [{ name: media, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ListingResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /provider/portfolio:
    patch:
      summary: Reorder (array order) and caption portfolio items
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { type: object, properties: { id: { type: string }, caption: { type: string } } } } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ListingResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /provider/claim/preview:
    post:
      summary: Describe an assisted-listing claim token (no sign-in; rate-limited)
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { token: { type: string } } } } } }
      responses:
        "200": { description: "display_name, channel, masked destination, expires_at" }
        "400": { $ref: "#/components/responses/Error" }
  /provider/claim:
    post:
      summary: Claim an assisted listing; the caller's verified phone/email must equal the invite destination
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token, accept_terms], properties: { token: { type: string }, accept_terms: { type: boolean } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ListingResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /provider/verifications:
    get:
      summary: The caller's verification requests, requestable badges and document types
      responses:
        "200": { description: OK }
    post:
      summary: "Request a badge (multipart: badge_type, document_type, service_id for licences, files ×1–3; PDF/JPEG/PNG/WebP, active PDFs rejected)"
      responses:
        "201": { description: OK }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /verification/badge-types:
    get:
      summary: Badge definitions (public)
      responses:
        "200": { description: OK }
  /providers/{slug}/contact-reveal:
    post:
      summary: Reveal one published contact (rate-limited; logged_in_only needs a session; records an analytics event)
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { channel: { type: string } } } } } }
      responses:
        "200": { description: "channel, value, href" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /services:
    get:
      summary: Published services for pickers (q matches name, category and synonyms)
      parameters: [{ name: q, in: query, schema: { type: string } }]
      responses:
        "200": { description: OK }
  /locations/{level}:
    get:
      summary: "Selectable locations for pickers: counties, towns?county=, areas?town=, search?q= (alias-aware)"
      parameters: [{ name: level, in: path, required: true, schema: { type: string, enum: [counties, towns, areas, search] } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/LocationRef" } } } } } } }
  /admin/providers:
    get:
      summary: Staff list / review queue (providers.view_any). status=pending_review is oldest-first
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { description: "items, next_cursor, counts by status" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: Create an assisted (unowned) draft and optionally send a claim invite (providers.create + providers.update_any)
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { provider_type: { type: string }, display_name: { type: string }, claim_channel: { type: string, enum: [sms, email] }, claim_destination: { type: string } } } } } }
      responses:
        "201": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ListingResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/providers/{id}:
    get:
      summary: Staff view with owner, claim and status history (providers.view_any)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ListingResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    patch:
      summary: Edit profile incl. slug and meta (providers.update_any); slug changes on ever-published listings redirect
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ListingResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/providers/{id}/status:
    post:
      summary: "Moderation: approve, reject*, suspend*, restore, pause, resume, submit, archive (*reason required). Each action has its own permission"
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [action], properties: { action: { type: string }, reason: { type: string, maxLength: 500 } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ListingResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/providers/{id}/invite:
    post:
      summary: (Re)send a claim invite for an unowned listing; earlier invites expire
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ListingResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/providers/{id}/{section}:
    description: "Staff equivalents of the owner endpoints (providers.update_any): services, services/{offer}, service-areas, contacts, media, media/{media}, portfolio"
  /admin/verifications:
    get:
      summary: Verification queue (providers.view_any); ?status=pending|verified|rejected|expired
      responses:
        "200": { description: OK }
  /admin/verifications/{id}:
    get:
      summary: Request with documents (download URLs are audited)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK }
    patch:
      summary: Approve (providers.verify; licences need expires_at) or reject with reason (providers.reject_verification)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { decision: { type: string, enum: [approve, reject] }, reason: { type: string }, expires_at: { type: string, format: date-time } } } } } }
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/media:
    get:
      summary: Public-media moderation queue (media.moderate); ?status=pending_moderation|active|rejected
      responses:
        "200": { description: OK }
  /admin/media/{id}:
    patch:
      summary: Approve or reject (note required) a public image (media.moderate)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { decision: { type: string, enum: [approve, reject] }, note: { type: string } } } } } }
      responses:
        "200": { description: OK }
  /admin/media/{id}/download:
    get:
      summary: Stream a private verification document (media.view_private); every view is audited
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: File }
  /admin/redirects:
    get:
      summary: Slug redirects (seo.manage_redirects)
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/Redirect" } }, meta: { $ref: "#/components/schemas/PageMeta" } } } } } }
    post:
      summary: Add a manual 301 redirect; chains are collapsed (seo.manage_redirects)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [old_path, new_path], properties: { old_path: { type: string }, new_path: { type: string } } } } } }
      responses:
        "201": { description: OK, content: { application/json: { schema: { type: object } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/redirects/{id}:
    delete:
      summary: Remove a redirect (seo.manage_redirects)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Removed }
